id: T06-invoice-utcnow-deprecation
seed: invoice-calc
archetype: upgrade
evaluation: verifiable
brief: |
  On Python 3.12, creating an `Invoice` without `issued_at` emits
  "DeprecationWarning: datetime.datetime.utcnow() is deprecated". Remove the
  deprecated call. The default `issued_at` must be the current time as a
  timezone-aware UTC datetime. `due_date` and the text rendering keep working,
  and passing an explicit `issued_at` keeps working as before.
