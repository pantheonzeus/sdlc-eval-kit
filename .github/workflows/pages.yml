name: Pages

# Builds the documentation site (docs/) with --strict on every pull request that touches it, and
# deploys it to GitHub Pages on a push to main. The task catalog is read from tasks/ at build time.

on:
  push:
    branches: [main]
    paths: [docs/**, tasks/**, .github/workflows/pages.yml]
  pull_request:
    paths: [docs/**, tasks/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build (strict)
        run: uv run --no-project --python 3.12 --with-requirements docs/requirements.txt mkdocs build --strict -f docs/mkdocs.yml
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read      # deploy-pages fetches the artifact by id
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
